services:
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: memgraph-mage
    ports:
      - "7687:7687"
      - "7444:7444"
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 0s
    command: ["--log-level=TRACE"]
    environment:
      - MEMGRAPH_USER=admin
      - MEMGRAPH_PASSWORD=adminpassword
    volumes:
      - memgraph_data:/var/lib/memgraph

  lab:
    image: memgraph/lab:latest
    container_name: memgraph-lab
    ports:
      - "3000:3000"
    depends_on:
      - memgraph
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph-mage
      - QUICK_CONNECT_MG_PORT=7687

volumes:
  memgraph_data: